name: Feature Request
description: Suggest an improvement for Stash
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Stash.

  - type: checkboxes
    id: existing-request
    attributes:
      label: Existing request
      options:
        - label: I searched for an existing request and could not find one.
          required: true

  - type: textarea
    id: feature
    attributes:
      label: What would you like Stash to add or improve?
      description: Describe the requested feature clearly.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
      description: Explain the problem this feature would solve.
    validations:
      required: true

  - type: textarea
    id: suggested-behavior
    attributes:
      label: Suggested behavior
      description: Describe how you imagine the feature working.
    validations:
      required: false

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add examples, screenshots, or related links.
    validations:
      required: false
